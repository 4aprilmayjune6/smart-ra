/* sparkline canvas: year->value dict, draws area + zero baseline + endpoint dot */
function sparkline(values, sev) {
  const ys = Object.keys(values).sort();
  const pts = ys.map(y => values[y]).filter(v => v !== null && v !== undefined);
  const cv = document.createElement('canvas');
  const W = 96, H = 30, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.className = 'spark';
  if (pts.length < 2) { return cv; }
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const min = Math.min(...pts, 0), max = Math.max(...pts, 0), span = (max - min) || 1;
  const pad = 3, x = i => pad + i * (W - 2 * pad) / (pts.length - 1);
  const y = v => H - pad - (v - min) / span * (H - 2 * pad);
  const col = getComputedStyle(document.documentElement).getPropertyValue(
    sev === 'RED' ? '--red' : sev === 'YELLOW' ? '--amber' : '--green').trim();
  // zero baseline
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-strong').trim();
  ctx.lineWidth = 1; ctx.setLineDash([2, 2]); ctx.beginPath();
  ctx.moveTo(pad, y(0)); ctx.lineTo(W - pad, y(0)); ctx.stroke(); ctx.setLineDash([]);
  // area
  ctx.beginPath(); ctx.moveTo(x(0), y(pts[0]));
  pts.forEach((v, i) => ctx.lineTo(x(i), y(v)));
  ctx.lineTo(x(pts.length - 1), y(0)); ctx.lineTo(x(0), y(0)); ctx.closePath();
  ctx.fillStyle = col + '22'; ctx.fill();
  // line
  ctx.beginPath(); ctx.moveTo(x(0), y(pts[0]));
  pts.forEach((v, i) => ctx.lineTo(x(i), y(v)));
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke();
  // endpoint
  ctx.beginPath(); ctx.arc(x(pts.length - 1), y(pts[pts.length - 1]), 2.4, 0, 7); ctx.fillStyle = col; ctx.fill();
  return cv;
}

function detailHTML(c) {
  const s = c.gc.overall_severity, sc = severityCounts(c);
  const fillW = Math.max(2, Math.min(100, c.gc.overall_score));
  const hard = c.gc.hard_rule_triggered
    ? `<div class="hardrule" style="${sevVars('RED')}"><span class="k">하드룰 발동</span> ${esc(c.gc.hard_rule_triggered)} → 즉시 적색(부록 B)</div>` : '';

  const indRows = c.gc.indicators.map(ind => {
    const multiYear = Object.keys(ind.values).length > 1;
    return `<tr style="${sevVars(ind.severity)}">
      <td><b>${esc(ind.name)}</b></td>
      <td><span class="chip"><span class="sev-dot"></span>${ind.severity}</span></td>
      <td>${esc(ind.reason)}</td>
      <td class="num" data-spark='${multiYear ? esc(JSON.stringify({v: ind.values, s: ind.severity})) : ''}'></td>
      <td><span class="tag">${esc(ind.ksa570_tag)}</span></td>
    </tr>`;
  }).join('');

  const sigRows = c.signals.filter(x => x.severity !== 'GREEN').map(sg => {
    const ev = sg.evidence && sg.evidence[0] && sg.evidence[0].rcept_no;
    const evLink = ev ? `<a class="ev" href="${esc(sg.evidence[0].url)}" target="_blank" rel="noopener">${esc(sg.evidence[0].rcept_no)} ↗</a>`
      : `<span class="untrusted">근거: ${esc((sg.evidence[0]||{}).type || '—')}</span>`;
    return `<div class="sig" style="${sevVars(sg.severity)}">
      <span class="chip"><span class="sev-dot"></span>${sg.severity}</span>
      <div class="lead">
        <span class="mod">${esc(sg.module)}·${esc(sg.category)}</span>
        <span class="title">${esc(sg.title)}</span>
      </div>
      ${evLink}
    </div>`;
  }).join('');

  const krCards = c.key_risks.map(k => `
    <div class="kr ${k.significant_risk_candidate ? 'sig' : ''}">
      <h4>${esc(k.title)}${k.significant_risk_candidate ? '<span class="flag">유의적 위험 후보</span>' : ''}</h4>
      <div class="rid">${esc(k.rule_id)} · 기여신호 ${k.source_signals.length}건</div>
      <div class="rationale">${esc(k.rationale)}</div>
      <dl>
        ${k.accounts.length ? `<dt>계정</dt><dd>${esc(k.accounts.join(', '))}</dd>` : ''}
        ${k.assertions.length ? `<dt>주장</dt><dd>${esc(k.assertions.join(', '))}</dd>` : ''}
        <dt>기준서</dt><dd class="std">${esc(k.standards.join(', ') || '—')}</dd>
      </dl>
      ${k.procedures.length ? `<ul>${k.procedures.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    </div>`).join('');

  const jetRows = c.jet.map(j => `<tr>
      <td class="std" style="font-family:var(--mono)">${esc(j.rule_id)}</td>
      <td class="num"><span class="mult">×${j.mult}</span></td>
      <td>${esc(j.reason)}</td>
      <td style="color:var(--muted)">${esc(j.kr)}</td>
    </tr>`).join('');

  return `
  <div class="eyebrow"><span class="num">02</span>${esc(c.name)} · 위험평가 상세</div>
  <div class="panel" style="${sevVars(s)}">
    <div class="panel-head">
      <div>
        <h2>${esc(c.name)} <span style="font-size:var(--fs-md);color:var(--faint);font-family:var(--mono)">${esc(c.corp_code)}</span></h2>
        <div class="meta">${esc(c.industry)} · KSIC ${esc(c.ksic)} · FY${c.year} · 스냅샷 ${esc(c.snapshot)}</div>
      </div>
      <div style="text-align:right">
        <span class="sev-pill" style="font-size:var(--fs-base);padding:5px 14px"><span class="sev-dot"></span>${SEV[s].ko} · ${s}</span>
      </div>
    </div>

    <div class="gauge-wrap">
      <div class="gauge-top"><span class="lbl">계속기업 위험점수 (KSA 570)</span>
        <span class="val">${c.gc.overall_score} / 100</span></div>
      <div class="gauge-track"><div class="gauge"></div>
        <div class="gauge-fill" style="width:${fillW}%"></div></div>
      <div class="gauge-marks"><span style="left:40%">40 · 황</span><span style="left:70%">70 · 적</span></div>
      ${hard}
    </div>

    <h3 class="sec">계속기업 지표 <span class="k">모듈 3 · 부록 B</span><span class="rule"></span></h3>
    <div class="tbl-scroll"><table>
      <thead><tr><th>지표</th><th>판정</th><th>근거 문장</th><th>추세</th><th>KSA 570 A3</th></tr></thead>
      <tbody>${indRows}</tbody>
    </table></div>

    <h3 class="sec">위험신호 <span class="k">모듈 1·2·3 · RED ${sc.RED} / YELLOW ${sc.YELLOW}</span><span class="rule"></span></h3>
    <div class="sig-groups">${sigRows || '<div class="untrusted" style="padding:8px">비녹색 신호 없음</div>'}</div>

    <h3 class="sec">핵심위험 <span class="k">모듈 4 · 교차검증 → ${c.key_risks.length}건 (유의적 ${signif(c)})</span><span class="rule"></span></h3>
    <div class="kr-grid">${krCards}</div>

    <h3 class="sec">전표분석(JET) 연동 <span class="flow"><b>KSA 315</b> 위험평가 → <b>KSA 240</b> 분개테스트</span><span class="rule"></span></h3>
    <div class="tbl-scroll"><table>
      <thead><tr><th>JET 룰</th><th>가중치</th><th>사유</th><th>원천 핵심위험</th></tr></thead>
      <tbody>${jetRows || '<tr><td colspan="4" style="color:var(--muted)">조정 대상 없음</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

let current = 0;
function select(i) {
  current = i;
  [...pf.children].forEach((c, j) => c.setAttribute('aria-selected', j === i ? 'true' : 'false'));
  const d = document.getElementById('detail');
  d.innerHTML = detailHTML(DATA.companies[i]);
  // inject sparklines
  d.querySelectorAll('[data-spark]').forEach(td => {
    const raw = td.getAttribute('data-spark'); if (!raw) return;
    const o = JSON.parse(raw); td.appendChild(sparkline(o.v, o.s));
  });
}

/* theme toggle */
const root = document.documentElement, btn = document.getElementById('themeBtn');
function currentTheme() {
  return root.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
btn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  btn.textContent = next === 'dark' ? '◑ 라이트' : '◐ 다크';
  select(current); // redraw canvases with new theme colors
});
btn.textContent = currentTheme() === 'dark' ? '◑ 라이트' : '◐ 다크';

select(0);
</script>
