[project]
name = "smart-ra"
version = "0.1.0"
description = "SMART-RA — DART 공시 기반 감사 위험평가 자동화 플랫폼 (RFP v1.2 Phase 0/1 참조구현)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "jinja2>=3",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
smart-ra = "smart_ra.cli:main"
smart-ra-mcp = "smart_ra.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smart_ra*"]

[tool.setuptools.package-data]
smart_ra = ["data/*.json", "rules/*.yaml", "memo/templates/*", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
