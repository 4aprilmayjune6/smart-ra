# 절차 라이브러리 (SFR-403) — KSA 330/240/540/550/570 기반 표준 감사절차.
# 산업 위험맵(je_rules)·교차검증 룰이 procedure id로 참조한다.
version: "0.1.0"

procedures:
  PROC-240-01:
    title: 경영진 통제무력화 대응 — 분개테스트
    ksa: ["KSA 240"]
    text: 회계기간 전반의 분개 및 기타 수정사항 중 비경상·수동·기말임박 전표를 추출하여 적정성을 검증한다(JET 연동).
  PROC-540-01:
    title: 회계추정치 감사 — 진행률/추정
    ksa: ["KSA 540"]
    text: 경영진의 추정 방법·가정·데이터의 합리성을 평가하고 추정 불확실성 및 경영진 편의(management bias) 징후를 검토한다.
  PROC-540-02:
    title: 회계추정치 재계산·민감도
    ksa: ["KSA 540"]
    text: 핵심 추정치를 독립적으로 재계산하고 가정 변동에 대한 민감도 분석 및 후속사건을 검토한다.
  PROC-550-01:
    title: 특수관계자·우발부채 완전성
    ksa: ["KSA 550"]
    text: 이사회 의사록·약정서·금융기관 조회를 통해 특수관계자 거래 및 지급보증·우발부채의 완전성을 검토한다.
  PROC-570-01:
    title: 계속기업 평가
    ksa: ["KSA 570"]
    text: 경영진의 계속기업 평가(최소 12개월)와 자금조달 계획의 실현가능성을 검토하고, 중요한 불확실성 존재 시 공시의 적정성을 평가한다.
  PROC-1115-01:
    title: 공사수익 진행률 검증
    ksa: ["KSA 540"]
    text: 총공사예정원가 변동 원인을 분석하고 현장별 진행률을 재계산하며 원가 투입 증빙을 표본 검사한다.
  PROC-1115-02:
    title: 미청구공사 회수가능성
    ksa: ["KSA 500"]
    text: 미청구공사의 후속 청구·입금 내역을 추적하여 회수가능성을 검토한다.
  PROC-1115-03:
    title: 매출 기간귀속(cut-off)
    ksa: ["KSA 500"]
    text: 기말 전후 출하·인도 증빙과 매출인식 시점을 대조하여 조기·가공 매출을 검토한다.
  PROC-1115-04:
    title: 본인·대리인(총액/순액) 판단 검토
    ksa: ["KSA 315"]
    text: 거래 통제·재고위험·가격결정권 관점에서 총액/순액 인식 판단의 적정성을 평가한다.
  PROC-1115-05:
    title: 라이선스 수행의무·거래가격 배분
    ksa: ["KSA 540"]
    text: 수행의무 식별 및 업프론트·마일스톤의 배분·인식시점을 계약 조건에 근거해 검토한다.
  PROC-1115-06:
    title: 변동대가 추정(반품·포인트)
    ksa: ["KSA 540"]
    text: 반품·고객보상 이력 데이터에 기반한 변동대가 추정의 합리성을 검토한다.
  PROC-501-01:
    title: 재고실사 입회
    ksa: ["KSA 501"]
    text: 기말 재고실사에 입회하고 표본 수량·상태를 확인하며 다점포 재고 실재성을 검토한다.
  PROC-1002-01:
    title: 재고 순실현가능가치 평가
    ksa: ["KSA 540"]
    text: 장기체화·진부화 재고의 순실현가능가치를 평가하고 평가손실 인식의 적정성을 검토한다.
  PROC-1036-01:
    title: 자산손상 검토
    ksa: ["KSA 540"]
    text: 손상징후를 식별하고 회수가능액 추정(현금창출단위)의 가정을 검토한다.
  PROC-1037-01:
    title: 우발부채·충당부채 공시
    ksa: ["KSA 550"]
    text: 지급보증·책임준공 등 신용보강 약정의 인식·공시 완전성을 검토한다.
  PROC-1038-01:
    title: 개발비 자산화 요건
    ksa: ["KSA 540"]
    text: 개발단계 자산화 6요건 충족 여부와 근거(기술적 실현가능성 등)를 검토한다.
